<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tidemark · Know when a page really changed</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232447D6'/%3E%3Cpath d='M6 12h20M6 18h13M6 24h7' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-view="list">
  <div class="app">
    <aside class="rail" aria-label="Monitors">
      <header class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M6 12h20M6 18h13M6 24h7"/></svg>
        <div><h1>Tidemark</h1><p id="rail-sub">Watching 0 pages</p></div>
      </header>
      <button class="btn primary wide" id="add-btn" type="button">Add a page</button>
      <ul id="monitor-list" class="monitor-list"></ul>
      <footer class="rail-foot">
        <button class="link" id="key-btn" type="button">Workspace key</button>
        <span>Only monitor pages you may access.</span>
      </footer>
    </aside>
    <main class="stage" id="stage" tabindex="-1"></main>
  </div>

  <dialog id="form-dlg" class="dlg"></dialog>
  <dialog id="picker-dlg" class="dlg dlg-wide"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
